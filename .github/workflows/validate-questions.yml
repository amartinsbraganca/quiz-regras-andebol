name: Validar perguntas

on:
  push:
    paths:
      - "questions.json"
      - "scripts/validate-questions.js"
      - ".github/workflows/validate-questions.yml"
  pull_request:
    paths:
      - "questions.json"
      - "scripts/validate-questions.js"
      - ".github/workflows/validate-questions.yml"

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-questions.js
